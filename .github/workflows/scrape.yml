name: Check Loylo Homework

on:
  schedule:
    - cron: '0 22,8,11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run Scraper
        env:
          LOILO_SCHOOL_ID: ${{ secrets.LOILO_SCHOOL_ID }}
          LOILO_USER_ID: ${{ secrets.LOILO_USER_ID }}
          LOILO_PASSWORD: ${{ secrets.LOILO_PASSWORD }}
        run: python scraper.py

      # 【機能追加】エラー時にスクリーンショットをGitHubへアップロード
      - name: Upload Error Screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: error_critical.png
          retention-days: 3

      - name: Commit and Push if updated
        if: success()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update homework data" && git push)
