name: Check Loylo Homework

on:
  schedule:
    # 日本時間 7:00, 17:00, 20:00 に自動実行
    - cron: '0 22,8,11 * * *'
  workflow_dispatch: # 手動実行用ボタン

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run Scraper
        env:
          LOILO_SCHOOL_ID: ${{ secrets.LOILO_SCHOOL_ID }}
          LOILO_USER_ID: ${{ secrets.LOILO_USER_ID }}
          LOILO_PASSWORD: ${{ secrets.LOILO_PASSWORD }}
        run: python scraper.py

      - name: Commit and Push if updated
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update homework data" && git push)
