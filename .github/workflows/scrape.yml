name: Check Loylo Homework

on:
  schedule:
    # 混雑回避のため「17分」に設定
    # 日本時間 07:17 (UTC 22:17), 17:17 (UTC 08:17), 20:17 (UTC 11:17)
    - cron: '17 22,8,11 * * *'
  workflow_dispatch: # 手動実行用ボタン

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run Scraper
        env:
          LOILO_SCHOOL_ID: ${{ secrets.LOILO_SCHOOL_ID }}
          LOILO_USER_ID: ${{ secrets.LOILO_USER_ID }}
          LOILO_PASSWORD: ${{ secrets.LOILO_PASSWORD }}
        run: python scraper.py

      # 実行スナップショットを history フォルダへ保存
      - name: Archive snapshot
        if: success()
        run: |
          mkdir -p history
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          cp data.json "history/data_${TIMESTAMP}.json"

      - name: Commit and Push if updated
        if: success()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json history/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update homework data and archive [skip ci]" && git push)
