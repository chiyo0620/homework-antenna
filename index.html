<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="300"> <!-- 5分ごとに自動更新 -->
  <title>宿題アンテナ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: background-color 0.5s ease;
      color: #fff;
      padding: 2rem;
    }
    body.alert { background-color: #e63946; } /* 未提出あり：赤 */
    body.clear { background-color: #2a9d8f; } /* 未提出なし：緑 */

    .status-title { font-size: 3rem; font-weight: bold; margin-bottom: 1.5rem; text-align: center; }
    .card-list { width: 100%; max-width: 600px; }
    .card {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 1.2rem 1.5rem;
      margin-bottom: 1rem;
    }
    .subject { font-size: 1.1rem; opacity: 0.9; }
    .title { font-size: 1.8rem; font-weight: bold; margin: 0.3rem 0; }
    .deadline { font-size: 1rem; opacity: 0.8; text-align: right; }
    .updated { position: absolute; bottom: 1rem; font-size: 0.8rem; opacity: 0.6; }
  </style>
</head>
<body class="clear" id="appBody">

  <div class="status-title" id="statusTitle">確認中...</div>
  <div class="card-list" id="cardList"></div>
  <div class="updated" id="updatedAt"></div>

  <script>
    async function fetchStatus() {
      try {
        const res = await fetch('./data.json?t=' + Date.now());
        const data = await res.json();

        const body = document.getElementById('appBody');
        const title = document.getElementById('statusTitle');
        const list = document.getElementById('cardList');
        const updated = document.getElementById('updatedAt');

        updated.textContent = '最終更新: ' + data.updated_at;
        list.innerHTML = '';

        if (data.count > 0) {
          body.className = 'alert';
          title.textContent = `未提出の宿題が ${data.count} 件あります！`;
          data.items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <div class="subject">${item.subject}</div>
              <div class="title">${item.title}</div>
              <div class="deadline">締切: ${item.deadline}</div>
            `;
            list.appendChild(card);
          });
        } else {
          body.className = 'clear';
          title.textContent = '🎉 宿題はすべて提出済みです！';
        }
      } catch (e) {
        console.error(e);
      }
    }
    fetchStatus();
  </script>
</body>
</html>
